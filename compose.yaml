name: ${COMPOSE_PROJECT_NAME:-bookflow}

services:
  postgres:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:0.8.6-pg17-bookworm}
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-bookflow_dev}
      TZ: UTC

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - internal

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.5-alpine}
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

    tmpfs:
      - /run/redis

    command:
      - /bin/sh
      - -ec
      - |
        cp /usr/local/etc/redis/redis.conf /run/redis/redis.conf
        printf '\nrequirepass %s\n' "$$REDIS_PASSWORD" >> /run/redis/redis.conf
        exec redis-server /run/redis/redis.conf

    networks:
      - internal

    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli -h 127.0.0.1 ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
  minio:
    # Tên service giữ lại để không phải đổi DNS nội bộ lúc dev.
    # Engine thực tế là RustFS, KHÔNG phải MinIO.
    image: ${MINIO_IMAGE:-rustfs/rustfs:1.0.0-rc.6}
    restart: unless-stopped

    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"

    command:
      - /data

    volumes:
      - rustfs_data:/data

    networks:
      - internal

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:9000/health
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
  ai-api:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: ${AI_API_IMAGE:-bookflow/ai-api}:${BOOKFLOW_IMAGE_TAG:-dev}
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8001
      BACKEND_BASE_URL: ${AI_BACKEND_BASE_URL:-http://host.docker.internal:3001}
      BACKEND_INTERNAL_TOKEN: ${AI_SERVICE_KEY:?AI_SERVICE_KEY is required}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      WORKER_ENABLED: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${AI_API_PORT:-18001}:8001"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
  ai-worker:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: ${AI_WORKER_IMAGE:-bookflow/ai-worker}:${BOOKFLOW_IMAGE_TAG:-dev}
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8001
      BACKEND_BASE_URL: ${AI_BACKEND_BASE_URL:-http://host.docker.internal:3001}
      BACKEND_INTERNAL_TOKEN: ${AI_SERVICE_KEY:?AI_SERVICE_KEY is required}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      WORKER_ENABLED: "true"
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command:
      - python
      - -m
      - app.workers.runner
networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  rustfs_data: