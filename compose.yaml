name: ${COMPOSE_PROJECT_NAME:-bookflow}

services:
  postgres:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:0.8.6-pg17-bookworm}
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-bookflow_dev}
      TZ: UTC

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - internal

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.5-alpine}
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

    tmpfs:
      - /run/redis

    command:
      - /bin/sh
      - -ec
      - |
        cp /usr/local/etc/redis/redis.conf /run/redis/redis.conf
        printf '\nrequirepass %s\n' "$$REDIS_PASSWORD" >> /run/redis/redis.conf
        exec redis-server /run/redis/redis.conf

    networks:
      - internal

    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli -h 127.0.0.1 ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
  minio:
    # Tên service giữ lại để không phải đổi DNS nội bộ lúc dev.
    # Engine thực tế là RustFS, KHÔNG phải MinIO.
    image: ${MINIO_IMAGE:-rustfs/rustfs:1.0.0-rc.6}
    restart: unless-stopped

    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"

    command:
      - /data

    volumes:
      - rustfs_data:/data

    networks:
      - internal

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:9000/health
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  rustfs_data: